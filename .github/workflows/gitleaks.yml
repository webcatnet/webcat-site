name: gitleaks secret scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Runs the free gitleaks CLI directly. The gitleaks-action@v2 wrapper
      # needs a paid/registered license key for organization-owned repos.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .
